[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-controller"
dynamic = ["version"]
description = "Raspberry Pi Smart Desk Controller & Workstation Agent"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Scott Meyer"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "pydantic>=2.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "paho-mqtt>=1.6.1,<3"
]

[project.optional-dependencies]
pi = [
    "fastapi>=0.100.0",
    "gpiozero>=2.0",
    "uvicorn>=0.22.0",
    "pillow>=9.5.0",
    "streamdeck>=0.9.0",
]
acroname = [
    "brainstem>=2.9.0",
]
desktop = [
    "packaging>=23.0",
    "pillow>=9.5.0",
    "psutil>=5.9.0",
    "pystray>=0.19.0",
    "pycaw==20251023; sys_platform == 'win32'",
]
build = [
    "pip-licenses>=5.0,<6",
    "pyinstaller>=6.0",
]
dev = [
    "bandit>=1.9,<2",
    "pip-audit>=2.9,<3",
    "ruff>=0.12,<1",
]

[project.scripts]
desk-controller = "desk_controller.pi_controller.main:main"
desk-agent = "desk_controller.desktop_agent.main_tray:main"

[project.urls]
Homepage = "https://github.com/Scott-Meyer/rpi-desk-controller"
Repository = "https://github.com/Scott-Meyer/rpi-desk-controller"
Issues = "https://github.com/Scott-Meyer/rpi-desk-controller/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "desk_controller.__version__"}

[tool.setuptools.package-data]
"desk_controller.desktop_agent" = [
    "web/*.html",
    "web/*.css",
    "web/*.js",
]
"desk_controller.pi_controller.api" = ["web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

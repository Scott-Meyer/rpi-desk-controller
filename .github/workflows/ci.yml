name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pi,desktop,dev]"
          python -m pip check

      - name: Static checks
        run: |
          ruff check .
          ruff format --check .
          bandit -q -r src -ll

      - name: Test imports and behavior
        run: |
          python -m compileall -q src
          python -c "from desk_controller.pi_controller.api.app import app; assert app.title"
          python -c "from desk_controller.desktop_agent.main_tray import DeskAgentTrayApp; assert DeskAgentTrayApp"
          python -m unittest discover -s tests

      - name: Validate shell scripts
        run: |
          bash -n scripts/setup_rpi.sh
          bash -n scripts/deploy.sh
          bash -n build_mac.sh

      - name: Verify wheel contents
        run: |
          python -m pip wheel --no-deps --wheel-dir wheelhouse .
          python -c "import glob, zipfile; wheel = glob.glob('wheelhouse/*.whl')[0]; names = zipfile.ZipFile(wheel).namelist(); assert any(name.endswith('desktop_agent/web/index.html') for name in names); assert not any(name.endswith('.exe') for name in names)"

      - name: Audit installed dependencies
        if: matrix.python-version == '3.12'
        run: pip-audit --local --skip-editable --progress-spinner off

  desktop-platforms:
    name: Desktop tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pi,desktop]"
          python -m pip check

      - name: Test platform behavior
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests
